name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 9,  php: '8.1' }
          - { laravel: 10, php: '8.2' }
          - { laravel: 11, php: '8.3' }
          - { laravel: 12, php: '8.4' }
          - { laravel: 13, php: '8.4' }
          - { laravel: 13, php: '8.5' }

    name: Laravel ${{ matrix.laravel }} - PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      # Laravel 9-11 are end of life and have open security advisories:
      # allow them here only to verify that apps still on those versions keep working.
      - name: Allow end-of-life Laravel versions
        if: matrix.laravel < 12
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-audit --with "laravel/framework:^${{ matrix.laravel }}.0"

      - name: Run tests
        run: vendor/bin/phpunit
